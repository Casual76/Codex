org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Esecuzione seriale: in parallelo due moduli toccano le stesse cartelle di build e su Windows
# uno dei due non riesce piu a cancellarle ("Failed to delete some children").
org.gradle.parallel=false
# Cache disattivata di proposito: su questa macchina il ripristino di una voce in cache vuole
# cancellare le cartelle dei report, e qualcosa (antivirus o indicizzatore) le tiene aperte per
# qualche istante. Il risultato erano build rosse che non avevano niente a che vedere con il codice.
org.gradle.caching=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36
kotlin.code.style=official
